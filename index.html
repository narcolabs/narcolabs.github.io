<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narco Labs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .badge {
            display: inline-block;
            background-color: #238636;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }

        h1 {
            color: #f0f6fc;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        p {
            color: #8b949e;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .btn {
            display: inline-block;
            background-color: #2f81f7;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #388bfd;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge">Online</span>
        <h1>Narco Labs</h1>
        <p>Welcome to our official hub. Projects, tools, and updates are coming soon.</p>
        <a href="https://github.com/narcolabs" class="btn">View GitHub Profile</a>
    </div>

</body>
</html>
